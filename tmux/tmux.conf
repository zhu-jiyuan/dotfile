unbind C-b
set -g prefix C-g
bind C-a send-prefix
# Programs inside tmux must use a tmux/screen terminfo entry. Using an xterm
# entry here breaks terminal capability detection, including Yazi's image size
# probe through Ghostty.
set -g default-terminal "tmux-256color"
# Advertise true color for Ghostty and other xterm-compatible clients.
set -as terminal-features ',xterm*:RGB'
set-option -sa terminal-overrides ",xterm*:Tc"

# Forward modified Enter only when an application requests extended keys.
set -s extended-keys on
# Codex requires CSI-u when requesting extended keys through tmux.
set -s extended-keys-format csi-u
set -as terminal-features ',xterm*:extkeys'

set -g history-limit 655350
set -g set-clipboard on

# Let Yazi pass Ghostty's Kitty graphics protocol through tmux. Keep this at
# `on`: unlike `all`, replies cannot leak into an invisible pane.
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# set escape time (time to wait after pressing Esc)
# to 10ms, this precents nvim delay with pressing Esc
# https://github.com/neovim/neovim/wiki/FAQ
set -sg escape-time 10

# vim autoread warning in ':checkhealth'
set-option -g focus-events on


# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Vim style pane selection
bind -n M-h select-pane -L
bind -n M-j select-pane -D 
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R


set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
# set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'samoshkin/tmux-plugin-sysstat'
set -g @plugin 'zhu-jiyuan/tmux-manager'

# {{{tmux-plugin-sysstat
# Only the colour-coded number; the cpu and mem labels are in status-right.
set -g @sysstat_cpu_view_tmpl '#[fg=#{cpu.color}]#{cpu.pused}'
set -g @sysstat_mem_view_tmpl '#[fg=#{mem.color}]#{mem.pused}'
# Stay neutral under normal load; the default 30% keeps CPU yellow all day.
set -g @sysstat_cpu_medium_threshold '60'
set -g @sysstat_cpu_stress_threshold '85'
set -g status-interval 3
# }}}

# don't jump to bottom when copy finished
set -g @yank_action 'copy-pipe'

# Use the native Wayland clipboard when available; fall back to X11.
set -g @override_copy_command 'sh -c "if command -v wl-copy >/dev/null 2>&1 && [ -n \"${WAYLAND_DISPLAY:-}\" ]; then wl-copy; else xclip -selection clipboard; fi"'

# {{{ tmux-better-mouse-mode
#set -g @scroll-down-exit-copy-mode "off"
#}}}

# tmux 3.8 paints popups, prompts and modes with a builtin light or dark theme;
# keep the terminal's own colours instead.
set -g theme terminal
# theme terminal still paints popups ANSI black and white; follow the terminal.
set -g popup-style default
set -g popup-border-style default
set -g popup-border-lines rounded


# set vi-mode
set-window-option -g mode-keys vi

bind-key -T prefix v copy-mode
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind-key r popup -d '#{pane_current_path}' -w 80% -h 80% -E "tmux new-session -A -s popup"
bind -n M-r if-shell -F '#{==:#{session_name},popup}' 'detach-client' 'popup -d "#{pane_current_path}" -w 80% -h 80% -E "tmux new-session -A -s popup"'
bind -n F5 popup -d '#{pane_current_path}' -w 80% -h 80%


# Kitty graphics replies begin with ESC _, which tmux 3.7c can misread as
# M-_. Never bind that sequence globally or Yazi image probing will split the
# current window. Use Alt+- for a vertical split instead.
unbind -n M-_
bind -n M-- split-window -v -c "#{pane_current_path}"
bind -n M-+ split-window -h -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind c new-window -a -c "#{pane_current_path}"


# {{{tm: fzf session / window / project switcher (prefix + s, prefix + w, prefix + f)
set -g @tm-projects "~/workspace ~/workspace/company ~/learning ~/dev ~/personal/dev ~/.config/nvim/local_plugins"
# Development: comment out the @plugin 'zhu-jiyuan/tmux-manager' line above
# and load the checkout instead. Its tm is a symlink to target/release/tm, so
# a rebuild takes effect at the next popup.
# run-shell ~/workspace/tmux-manager/tm.tmux
# }}}

# {{{ status bar
# Two solid pastel capsules, everything else plain text: the session (sand;
# rose while prefix is down, butter in copy mode) and the current window
# (lavender). The text around them is purple-grey; a bell is rose. The palette
# is hex, made for the #fdf6e3 background that Solarized Light (Ghostty) and
# Everforest Light (kitty) share. The capsule caps are Nerd Font powerline
# glyphs, which Ghostty bundles.
set -g @ses_fill '#{?client_prefix,#f5cdd5,#{?pane_in_mode,#f6e2b5,#e4dfd0}}'
set -g @ses_text '#{?client_prefix,#9a2243,#{?pane_in_mode,#735200,#4b4636}}'
set -g @win_fill '#dcd5f0'
set -g @win_text '#463a8c'
set -g @muted '#a8a2bb'
set -g @text '#5f587a'
set -g @spark '#8a83b0'
set -g @bell '#9a2243'
# tmux-plugin-sysstat colours the CPU and memory numbers itself, so these
# repeat the hex: @text normally, then amber and rose under load.
set -g @sysstat_cpu_color_low '#5f587a'
set -g @sysstat_cpu_color_medium '#a0711a'
set -g @sysstat_cpu_color_stress '#b0304f'
set -g @sysstat_mem_color_low '#5f587a'
set -g @sysstat_mem_color_medium '#a0711a'
set -g @sysstat_mem_color_stress '#b0304f'

# With many windows the list steps down a tier when the current one does not
# fit, measured rather than counted, so the terminal width and name lengths
# both count: 1) full names and the path; 2) no path, names cut to 10
# columns; 3) other windows show only their index. absolute-centre centres the
# list on the whole line, so its room is the width minus twice the wider side:
# the session capsule (plus the path in tier 1) or status-right (40 columns,
# plus the host over SSH). @pathw is the current pane's path as status-left
# shows it, capped at 40 like tmux-path-abbrev.sh, plus its two-space gap.
# Widths use w:, the display width; n: counts bytes, so … would count as 3.
set -g @home "$HOME"
set -g @list_full '#{e|+:#{w:#{W:#I #{=/16/…:window_name}   }},1}'
set -g @list_short '#{e|+:#{w:#{W:#I #{=/#{?window_active,16,10}/…:window_name}  }},1}'
set -g @sesw '#{e|+:#{w:session_name},3}'
set -g @right_w '#{e|+:40,#{?#{@host},#{e|+:#{w:host_short},3},0}}'
set -g @pathw '#{e|+:#{W:#{?window_active,#{?#{e|>:#{w:#{s|^#{@home}|~|:pane_current_path}},40},40,#{w:#{s|^#{@home}|~|:pane_current_path}}},}},2}'
set -g @side_path '#{?#{e|>:#{e|+:#{E:@sesw},#{E:@pathw}},#{E:@right_w}},#{e|+:#{E:@sesw},#{E:@pathw}},#{E:@right_w}}'
set -g @side_bare '#{?#{e|>:#{E:@sesw},#{E:@right_w}},#{E:@sesw},#{E:@right_w}}'
set -g @room_path '#{e|-:#{window_width},#{e|+:#{e|*:#{E:@side_path},2},2}}'
set -g @room_bare '#{e|-:#{window_width},#{e|+:#{e|*:#{E:@side_bare},2},2}}'
set -g @tier '#{?#{e|<=:#{E:@list_full},#{E:@room_path}},1,#{?#{e|<=:#{E:@list_short},#{E:@room_bare}},2,3}}'

set -g status-justify absolute-centre
set -g status-style bg=default

set -g status-left-length 100
set -g status-left " #[fg=#{E:@ses_fill}]#[fg=#{E:@ses_text},bg=#{E:@ses_fill},bold]#S#[fg=#{E:@ses_fill},bg=default,nobold]#{?#{==:#{E:@tier},1},  #[fg=#{@muted}]#($HOME/.config/tmux/scripts/tmux-path-abbrev.sh '#{pane_current_path}'),}"
set -g status-left-style default

# tmux 3.8 underlines the current window and reverses bells by default; the
# formats below do all the styling. A bell turns a window rose; Z marks a
# zoomed pane in the current window. Windows sit three columns apart in
# tier 1, two in tier 2 and one in tier 3: the separator is one space and each
# window adds the rest in front of itself.
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-last-style default
set -g window-status-activity-style default
set -g window-status-bell-style default
set -g window-status-separator ' '
set -g window-status-format "#{?#{==:#{E:@tier},1},  ,#{?#{==:#{E:@tier},2}, ,}}#{?window_bell_flag,#[fg=#{@bell}]#[bold],#[fg=#{@muted}]}#I#{?#{==:#{E:@tier},3},,#{?window_bell_flag,,#[fg=#{@text}]} #{=/#{?#{==:#{E:@tier},1},16,10}/…:window_name}}#[nobold]"
set -g window-status-current-format "#{?#{==:#{E:@tier},1},  ,#{?#{==:#{E:@tier},2}, ,}}#[fg=#{@win_fill}]#[fg=#{@win_text},bg=#{@win_fill},bold]#I #{=/16/…:window_name}#{?window_zoomed_flag, Z,}#[fg=#{@win_fill},bg=default,nobold]"

# Network speed, a CPU sparkline and memory, as plain text; the numbers turn
# amber or rose only under load (thresholds in the tmux-plugin-sysstat block).
set -g status-right-length 200
set -g status-right "#($HOME/.config/tmux/scripts/tmux-net.sh '#{@muted}' '#{@text}')   #[fg=#{@muted}]cpu #($HOME/.config/tmux/scripts/tmux-cpu.sh '#{@spark}')  #[fg=#{@muted}]mem #($HOME/.config/tmux/plugins/tmux-plugin-sysstat/scripts/mem.sh)#{E:@host} "
# The host only tells machines apart over SSH.
set -gu @host
if-shell '[ -n "$SSH_CONNECTION" ]' "set -g @host '   #[fg=#{@win_text}]#[bold]#h#[nobold]'"

# Name windows after the directory when a shell is in front, and call Claude
# Code "claude" rather than the version it sets as its process title.
set -g automatic-rename-format '#{?pane_in_mode,[tmux],#{?#{m/r:^(zsh|bash|fish|sh)$,#{pane_current_command}},#{b:pane_current_path},#{?#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},claude,#{pane_current_command}}}}#{?pane_dead,[dead],}'
# }}}

run '~/.config/tmux/plugins/tpm/tpm'
